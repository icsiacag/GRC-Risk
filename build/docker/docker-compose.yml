version: '3.9'

services:
  webapi:
    build:
      context: ../..
      dockerfile: build/docker/Dockerfile
    ports:
      - \"5000:80\"
    depends_on:
      - db
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=RiskDB;User Id=sa;Password=YourStrong!Passw0rd;

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - \"1433:1433\"
    environment:
      SA_PASSWORD: YourStrong!Passw0rd
      ACCEPT_EULA: \"Y\"
    volumes:
      - sql-data:/var/opt/mssql

volumes:
  sql-data:
